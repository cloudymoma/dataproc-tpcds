<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <!-- Hand-drawn filter for sketch effect -->
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Marker for arrows - cyan for data flow -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#56d4c8"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff7eb3"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7fdb8a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb74d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" font-family="Comic Sans MS, cursive" font-size="24" fill="#56d4c8" text-anchor="middle" font-weight="bold">TPC-DS Dataproc Benchmark Architecture</text>

  <!-- User/CLI Box -->
  <rect x="30" y="80" width="130" height="60" rx="5" fill="#fff3cd" stroke="#856404" stroke-width="2" filter="url(#sketch)"/>
  <text x="95" y="105" font-family="Comic Sans MS, cursive" font-size="13" fill="#856404" text-anchor="middle">User / CLI</text>
  <text x="95" y="125" font-family="Comic Sans MS, cursive" font-size="11" fill="#666" text-anchor="middle">$ python main.py</text>

  <!-- conf.yaml -->
  <rect x="30" y="160" width="130" height="45" rx="3" fill="#e8f4ea" stroke="#28a745" stroke-width="2" filter="url(#sketch)"/>
  <text x="95" y="188" font-family="Comic Sans MS, cursive" font-size="12" fill="#28a745" text-anchor="middle">conf.yaml</text>

  <!-- Arrow: User to conf.yaml -->
  <path d="M95 142 L95 158" stroke="#56d4c8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <text x="105" y="153" font-family="Comic Sans MS, cursive" font-size="9" fill="#56d4c8">reads</text>

  <!-- Main Orchestrator Box -->
  <rect x="200" y="70" width="200" height="150" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5" filter="url(#sketch)"/>
  <text x="300" y="95" font-family="Comic Sans MS, cursive" font-size="14" fill="#1976d2" text-anchor="middle" font-weight="bold">main.py</text>
  <text x="300" y="115" font-family="Comic Sans MS, cursive" font-size="10" fill="#555" text-anchor="middle">(Orchestrator)</text>

  <!-- Inner modules -->
  <rect x="215" y="125" width="80" height="35" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="255" y="147" font-family="Comic Sans MS, cursive" font-size="9" fill="#0d47a1" text-anchor="middle">ClusterManager</text>

  <rect x="305" y="125" width="80" height="35" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="345" y="147" font-family="Comic Sans MS, cursive" font-size="9" fill="#0d47a1" text-anchor="middle">DataGenerator</text>

  <rect x="215" y="170" width="80" height="35" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="255" y="192" font-family="Comic Sans MS, cursive" font-size="9" fill="#0d47a1" text-anchor="middle">QueryRunner</text>

  <rect x="305" y="170" width="80" height="35" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="345" y="192" font-family="Comic Sans MS, cursive" font-size="9" fill="#0d47a1" text-anchor="middle">BQReporter</text>

  <!-- Arrow: conf to main -->
  <path d="M162 180 C180 180, 180 145, 198 145" stroke="#7fdbca" stroke-width="2" fill="none" stroke-dasharray="5,3"/>

  <!-- Arrow: User to main -->
  <path d="M162 110 L198 110" stroke="#56d4c8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- GCP Cloud Box -->
  <rect x="440" y="55" width="440" height="580" rx="15" fill="#f8f9fa" stroke="#5f6368" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="660" y="80" font-family="Comic Sans MS, cursive" font-size="16" fill="#5f6368" text-anchor="middle" font-weight="bold">Google Cloud Platform</text>

  <!-- Dataproc Section -->
  <rect x="460" y="100" width="190" height="200" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2" filter="url(#sketch)"/>
  <text x="555" y="125" font-family="Comic Sans MS, cursive" font-size="14" fill="#c2185b" text-anchor="middle" font-weight="bold">Dataproc</text>

  <!-- History Server -->
  <rect x="475" y="140" width="160" height="50" rx="5" fill="#f8bbd9" stroke="#ad1457" stroke-width="1.5"/>
  <text x="555" y="160" font-family="Comic Sans MS, cursive" font-size="10" fill="#880e4f" text-anchor="middle">History Server</text>
  <text x="555" y="178" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">(Spark UI, event logs)</text>

  <!-- Job Cluster -->
  <rect x="475" y="200" width="160" height="85" rx="5" fill="#f8bbd9" stroke="#ad1457" stroke-width="1.5"/>
  <text x="555" y="220" font-family="Comic Sans MS, cursive" font-size="10" fill="#880e4f" text-anchor="middle">Job Cluster</text>
  <text x="555" y="238" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">Master + Workers</text>
  <text x="555" y="255" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">spark-sql-perf</text>
  <text x="555" y="272" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">TPC-DS queries</text>

  <!-- GCS Section -->
  <rect x="670" y="100" width="190" height="200" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#sketch)"/>
  <text x="765" y="125" font-family="Comic Sans MS, cursive" font-size="14" fill="#388e3c" text-anchor="middle" font-weight="bold">Cloud Storage</text>

  <!-- GCS folders -->
  <rect x="685" y="140" width="160" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="765" y="163" font-family="Comic Sans MS, cursive" font-size="9" fill="#1b5e20" text-anchor="middle">lib/ (JAR + dsdgen)</text>

  <rect x="685" y="185" width="160" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="765" y="208" font-family="Comic Sans MS, cursive" font-size="9" fill="#1b5e20" text-anchor="middle">tpcds-data/ (24 tables)</text>

  <rect x="685" y="230" width="160" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="765" y="253" font-family="Comic Sans MS, cursive" font-size="9" fill="#1b5e20" text-anchor="middle">spark-events/ (logs)</text>

  <!-- BigQuery Section -->
  <rect x="460" y="320" width="400" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#sketch)"/>
  <text x="660" y="350" font-family="Comic Sans MS, cursive" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">BigQuery</text>
  <text x="660" y="375" font-family="Comic Sans MS, cursive" font-size="10" fill="#bf360c" text-anchor="middle">tpcds_metrics.benchmark_history</text>
  <text x="660" y="400" font-family="Comic Sans MS, cursive" font-size="9" fill="#666" text-anchor="middle">(query times, cluster info, Spark metrics)</text>

  <!-- Arrows from Orchestrator to GCP -->

  <!-- ClusterManager to Dataproc -->
  <path d="M297 145 C390 145, 420 180, 458 180" stroke="#ff7eb3" stroke-width="2" marker-end="url(#arrow-pink)" fill="none"/>
  <text x="380" y="140" font-family="Comic Sans MS, cursive" font-size="8" fill="#ff7eb3">create/delete</text>

  <!-- DataGenerator to Job Cluster -->
  <path d="M387 142 C420 142, 430 240, 473 240" stroke="#ff7eb3" stroke-width="2" marker-end="url(#arrow-pink)" fill="none"/>
  <text x="410" y="195" font-family="Comic Sans MS, cursive" font-size="8" fill="#ff7eb3" transform="rotate(-25, 410, 195)">submit job</text>

  <!-- Job Cluster to GCS (data) -->
  <path d="M637 240 C655 240, 665 202, 683 202" stroke="#7fdb8a" stroke-width="2" marker-end="url(#arrow-green)" fill="none"/>
  <text x="660" y="215" font-family="Comic Sans MS, cursive" font-size="8" fill="#7fdb8a">read/write</text>

  <!-- QueryRunner to Job Cluster -->
  <path d="M297 190 C350 250, 420 280, 473 270" stroke="#ff7eb3" stroke-width="2" marker-end="url(#arrow-pink)" fill="none"/>
  <text x="350" y="275" font-family="Comic Sans MS, cursive" font-size="8" fill="#ff7eb3">run SQL</text>

  <!-- BQReporter to BigQuery -->
  <path d="M387 192 C430 280, 430 360, 458 360" stroke="#ffb74d" stroke-width="2" marker-end="url(#arrow-orange)" fill="none"/>
  <text x="400" y="310" font-family="Comic Sans MS, cursive" font-size="8" fill="#ffb74d">report metrics</text>

  <!-- History Server to spark-events -->
  <path d="M637 165 C670 165, 670 247, 683 247" stroke="#7fdbca" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <text x="647" y="180" font-family="Comic Sans MS, cursive" font-size="7" fill="#7fdbca">read logs</text>

  <!-- Data Flow Section -->
  <rect x="460" y="445" width="400" height="175" rx="8" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2" filter="url(#sketch)"/>
  <text x="660" y="470" font-family="Comic Sans MS, cursive" font-size="13" fill="#7b1fa2" text-anchor="middle" font-weight="bold">Workflow</text>

  <!-- Flow steps -->
  <circle cx="500" cy="500" r="14" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="500" y="505" font-family="Comic Sans MS, cursive" font-size="11" fill="#4a148c" text-anchor="middle">1</text>
  <text x="530" y="505" font-family="Comic Sans MS, cursive" font-size="10" fill="#4a148c" text-anchor="start">Create clusters</text>

  <circle cx="500" cy="535" r="14" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="500" y="540" font-family="Comic Sans MS, cursive" font-size="11" fill="#4a148c" text-anchor="middle">2</text>
  <text x="530" y="540" font-family="Comic Sans MS, cursive" font-size="10" fill="#4a148c" text-anchor="start">Verify TPC-DS data exists</text>

  <circle cx="500" cy="570" r="14" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="500" y="575" font-family="Comic Sans MS, cursive" font-size="11" fill="#4a148c" text-anchor="middle">3</text>
  <text x="530" y="575" font-family="Comic Sans MS, cursive" font-size="10" fill="#4a148c" text-anchor="start">Run 99 TPC-DS queries</text>

  <circle cx="500" cy="605" r="14" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="500" y="610" font-family="Comic Sans MS, cursive" font-size="11" fill="#4a148c" text-anchor="middle">4</text>
  <text x="530" y="610" font-family="Comic Sans MS, cursive" font-size="10" fill="#4a148c" text-anchor="start">Report metrics to BigQuery</text>

  <!-- Legend -->
  <rect x="30" y="230" width="140" height="130" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" filter="url(#sketch)"/>
  <text x="100" y="250" font-family="Comic Sans MS, cursive" font-size="11" fill="#616161" text-anchor="middle" font-weight="bold">Legend</text>

  <line x1="45" y1="270" x2="85" y2="270" stroke="#56d4c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="274" font-family="Comic Sans MS, cursive" font-size="9" fill="#56d4c8">data flow</text>

  <line x1="45" y1="295" x2="85" y2="295" stroke="#7fdbca" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="95" y="299" font-family="Comic Sans MS, cursive" font-size="9" fill="#7fdbca">config/read</text>

  <rect x="45" y="310" width="40" height="15" rx="2" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="95" y="323" font-family="Comic Sans MS, cursive" font-size="9" fill="#666">Python lib</text>

  <rect x="45" y="335" width="40" height="15" rx="2" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="95" y="348" font-family="Comic Sans MS, cursive" font-size="9" fill="#666">GCP service</text>

  <!-- SQL folder note -->
  <rect x="30" y="385" width="140" height="50" rx="5" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5" filter="url(#sketch)"/>
  <text x="100" y="405" font-family="Comic Sans MS, cursive" font-size="10" fill="#e65100" text-anchor="middle">sql/</text>
  <text x="100" y="423" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">99 TPC-DS queries</text>

  <!-- Arrow from sql folder to QueryRunner -->
  <path d="M172 405 C200 405, 200 350, 255 350 L255 207" stroke="#ffcc5c" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-orange)"/>
  <text x="215" y="375" font-family="Comic Sans MS, cursive" font-size="8" fill="#ffcc5c">loads</text>

  <!-- assets folder note -->
  <rect x="30" y="455" width="140" height="60" rx="5" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5" filter="url(#sketch)"/>
  <text x="100" y="475" font-family="Comic Sans MS, cursive" font-size="10" fill="#006064" text-anchor="middle">assets/</text>
  <text x="100" y="493" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">spark-sql-perf.jar</text>
  <text x="100" y="507" font-family="Comic Sans MS, cursive" font-size="8" fill="#666" text-anchor="middle">tpcds-kit (dsdgen)</text>

  <!-- Arrow from assets to DataGenerator -->
  <path d="M172 480 C250 480, 250 300, 345 300 L345 207" stroke="#5ce1e6" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="250" y="400" font-family="Comic Sans MS, cursive" font-size="8" fill="#5ce1e6">uploads</text>

</svg>
