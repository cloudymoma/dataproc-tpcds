[package]
name = "tpcds-datagen"
version = "0.1.0"
edition = "2021"
authors = ["TPC-DS Benchmark Team"]
description = "High-performance TPC-DS data generator with parallel GCS upload"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "sync", "fs", "io-util"] }

# Arrow and Parquet for columnar data
arrow = { version = "53", features = ["prettyprint"] }
parquet = { version = "53", features = ["arrow", "snap", "zstd", "lz4"] }

# GCS upload
object_store = { version = "0.11", features = ["gcp"] }

# Parallelism and channels
crossbeam = "0.8"
rayon = "1.10"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Random data generation
rand = "0.8"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# CLI and logging
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
bytes = "1.5"
itoa = "1.0"
futures = "0.3"
notify = "6.1"
walkdir = "2.4"
num_cpus = "1.16"
tempfile = "3.10"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
