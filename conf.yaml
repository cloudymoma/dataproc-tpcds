# GCP Dataproc TPC-DS Auto-Benchmark Tool Configuration
# This is the only file users need to modify

# --- Google Cloud Basic Configuration ---
gcp:
  project_id: "du-hast-mich"
  region: "us-central1"
  zone: "us-central1-a"
  # Service Account JSON path, leave empty to use default credentials
  service_account_key_path: "~/workspace/google/sa.json"
  # GCS Bucket for all benchmark artifacts (single bucket, organized by subfolders):
  #   - lib/           : data generation assets (JAR, dsdgen binary)
  #   - spark-events/  : Spark event logs for History Server
  #   - scripts/       : auto-generated query execution scripts
  #   - tpcds-data/    : generated TPC-DS data (customizable via data_path)
  staging_bucket: "gs://du-hast-mich-tpcds-bench"

# --- Spark History Server Configuration (Optional) ---
# A dedicated single-node cluster for viewing Spark job history
history_server:
  enable: true
  cluster_name: "tpcds-history-server"
  machine_type: "n2-standard-4"
  boot_disk_size_gb: 128
  boot_disk_type: "pd-balanced"
  # GCS path for Spark event logs (shared with job cluster)
  log_dir: "gs://du-hast-mich-tpcds-bench/spark-events"
  # Spark properties for History Server
  spark_properties:
    "spark.history.fs.cleaner.enabled": "true"
    "spark.history.fs.cleaner.interval": "7d"
    "spark.history.fs.cleaner.maxAge": "30d"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "128m"

# --- Dataproc Job Cluster Configuration ---
dataproc:
  cluster_name: "tpcds-bench-cluster"
  image_version: "2.3-debian12"  # Determines Spark version

  # Cluster lifecycle
  max_idle: "1h"                 # Auto-delete after idle period (e.g., "30m", "1h", "2h")
  tier: "premium"                # "standard" or "premium" (premium enables Lightning Engine)

  # Master node configuration (runs driver in client mode)
  num_masters: 1                 # 1 for standard, 3 for high-availability (HA)
  master_machine_type: "n2-standard-8"
  master_boot_disk_size_gb: 500
  master_boot_disk_type: "pd-ssd"
  num_master_local_ssds: 1
  master_local_ssd_interface: "NVME"

  # Worker nodes configuration (runs executors only)
  num_workers: 4                 # 4 workers × 2 executors = 8 executors
  worker_machine_type: "n2-standard-8"
  worker_boot_disk_size_gb: 500
  worker_boot_disk_type: "pd-ssd"
  num_worker_local_ssds: 1
  worker_local_ssd_interface: "NVME"

  enable_component_gateway: true

  # Initialization scripts (optional)
  init_actions: []

  # Spark resource configuration
  # IMPORTANT: User is responsible for ensuring resources fit within cluster capacity.
  # If insufficient resources, job submission will fail with YARN allocation error.
  spark_properties:
    # Executor count
    "spark.dynamicAllocation.enabled": "false"
    "spark.executor.instances": "8"
    # Executor sizing (maximized for n2-standard-8)
    "spark.executor.cores": "4"
    "spark.executor.memory": "14g"
    "spark.executor.memoryOverhead": "1g"
    # Driver settings (runs on master node in client mode: n2-standard-8)
    "spark.driver.cores": "6"
    "spark.driver.memory": "24g"
    "spark.driver.memoryOverhead": "4g"
    # Serialization
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    # Adaptive Query Execution (AQE)
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    # Dataproc enhanced optimizer and execution
    "spark.dataproc.enhanced.optimizer.enabled": "true"
    "spark.dataproc.enhanced.execution.enabled": "true"
    # GCS FileSystem configuration
    "spark.hadoop.fs.gs.impl": "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
    "spark.hadoop.fs.AbstractFileSystem.gs.impl": "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
    # Dataproc file output committer (optimized for concurrent writes)
    "spark.hadoop.mapreduce.outputcommitter.factory.class": "org.apache.hadoop.mapreduce.lib.output.DataprocFileOutputCommitterFactory"
    "spark.hadoop.mapreduce.fileoutputcommitter.marksuccessfuljobs": "false"
    # Event logging (for History Server integration)
    # Optimized for minimal performance impact
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "gs://du-hast-mich-tpcds-bench/spark-events"
    "spark.eventLog.compress": "true"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "128m"
    "spark.eventLog.buffer.kb": "256"
  # Dataproc cluster properties
  dataproc_properties:
    "dataproc.cluster.caching.enabled": "true"

# --- TPC-DS Benchmark Configuration ---
benchmark:
  scale_factor: 1000            # GB, e.g., 1000 = 1TB
  data_format: "parquet"        # parquet or orc
  format_compression: "snappy"
  # GCS path for data storage
  data_path: "gs://du-hast-mich-tpcds-bench/tpcds-data/1T"
  # Skip data generation if data already exists
  skip_data_gen: false
  # Queries to run: "all" or list like [1, 2, 3]
  queries_to_run: "all"
  # Number of iterations per test run
  iterations: 1

# --- Data Generator Configuration (spark-sql-perf) ---
# Data is generated using Databricks spark-sql-perf with native dsdgen binary
# for full TPC-DS compliance with all 24 tables
datagen:
  # Partitioning (0 = auto-calculate: scale_factor * 8 for ~128MB files)
  # Override only if you have specific requirements
  num_partitions: 0

  # TPC-DS generation options
  partition_tables: true              # Partition large tables (recommended)
  cluster_by_partition_columns: true  # Cluster data by partition columns
  filter_out_null_partition_values: false
  use_double_for_decimal: false       # Set true for older Spark versions

  # Job timeout in seconds (default: 7200 = 2 hours)
  # Increase for larger scale factors (10TB+ may need 4+ hours)
  job_timeout_seconds: 7200

  # Asset versions (must match files in assets/ directory)
  # Run 'make build-assets' to create these files
  spark_sql_perf_version: "0.5.1"
  tpcds_kit_version: "1.0.0"

# --- BigQuery Reporting Configuration (Optional) ---
bigquery:
  enable: true
  dataset: "tpcds_metrics"
  table: "benchmark_history"
